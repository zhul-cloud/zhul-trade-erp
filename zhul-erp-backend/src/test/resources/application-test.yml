# 集成测试专用配置：连独立的 zhul_erp_test 库，Redis 用 db 1，与开发环境隔离。
# 库结构由 Flyway 在 Spring 测试上下文启动时自动建好/升级（db/migration，不含 db/dev-data，
# 各用例自己造账号/角色数据，见 IntegrationTestBase），首次跑不需要手动建库；
# 想彻底重来（比如迁移脚本改坏了）执行 sql/build/test/reset-test-db.sh 删库重建。
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/zhul_erp_test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 1

zhul:
  upload:
    dir: ./target/test-uploads
  ai-task:
    # 测试里不需要超时扫描去动数据
    timeout-check-interval-ms: 3600000

logging:
  level:
    com.zhul.erp: info
