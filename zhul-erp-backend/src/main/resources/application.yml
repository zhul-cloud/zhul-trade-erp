server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: zhul-erp
  profiles:
    active: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:zhul_erp}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}

  # Flyway 自动建表/升级：启动时执行 db/migration 下未跑过的迁移，无需再手动 mysql < xxx.sql。
  # 示例租户/管理员账号等仅供本地体验的种子数据不在这里，只在 application-dev.yml 里追加
  # classpath:db/dev-data 才会执行，避免生产环境被灌入示例账号。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 单据模板种子数据里有 ${item.model} 这类模版占位符，关闭 Flyway 自己的占位符替换，原样写入
    placeholder-replacement: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms


  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  servlet:
    multipart:
      # 商品视频最大 100MB；各上传接口自己再按业务限制校验大小（图片、询盘附件仍是 5MB）
      max-file-size: 210MB
      max-request-size: 210MB

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

jwt:
  secret: ${JWT_SECRET:zhul-erp-secret-key-must-be-at-least-256-bits-long}
  expiration: 7200
  remember-me-expiration: 604800

zhul:
  # 构建时由 Maven 资源过滤替换为 pom 里的版本号，不要手改
  version: '@project.version@'
  crypto:
    aes-key: ${AES_KEY:zhul-erp-config-aes-key}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    # 私有文件（供应商营业执照、合同等），不在 /uploads 静态资源映射内，只能经需要权限的接口下载
    private-dir: ${UPLOAD_PRIVATE_DIR:./private-uploads}
  # 允许跨域调用 /api/** 的浏览器来源，逗号分隔，支持通配（如 https://*.example.com）。
  # 后端在前端 Nginx 之后看到的地址是 http://backend:8080，浏览器从页面域名发出的请求都会按跨域校验，
  # 所以生产必须写上用户访问的页面地址（如 https://erp.example.com），否则登录等请求会被拒（403）。
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*}
  # 文件存储：local 存服务器目录（上面两个目录），oss 存阿里云 OSS；切换见 docs/06-部署运维/07-对象存储.md
  storage:
    type: ${STORAGE_TYPE:local}
    # 私有文件签名链接的有效期（秒）
    signed-url-ttl-seconds: ${STORAGE_SIGNED_URL_TTL_SECONDS:600}
    # 视频转码：同时转码的数量与排队上限；ffmpeg 不在 PATH 时填绝对路径
    transcode-threads: ${STORAGE_TRANSCODE_THREADS:1}
    transcode-queue-capacity: ${STORAGE_TRANSCODE_QUEUE_CAPACITY:100}
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    oss:
      endpoint: ${OSS_ENDPOINT:}
      region: ${OSS_REGION:}
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
      private-bucket: ${OSS_PRIVATE_BUCKET:}
      public-bucket: ${OSS_PUBLIC_BUCKET:}
      public-domain: ${OSS_PUBLIC_DOMAIN:}
      key-prefix: ${OSS_KEY_PREFIX:}
  ai-task:
    # AI 编排服务地址（本次不实现该服务本身，本地联调可指向 scripts/ai-orchestrator-stub）
    orchestrator-base-url: ${AI_ORCHESTRATOR_BASE_URL:http://localhost:8899}
    # zhul-erp-backend 自身对外可达地址，用于拼出 webhook 回调地址
    callback-base-url: ${AI_TASK_CALLBACK_BASE_URL:http://localhost:8080}
    # webhook 回调鉴权共享密钥，AI 编排服务回调时须在 X-AI-Callback-Token 头携带同样的值
    callback-token: ${AI_TASK_CALLBACK_TOKEN:zhul-erp-ai-callback-secret}
    # 任务停留在"排队中/处理中"超过这个时长（分钟）视为超时，标记失败并转人工。
    # 接入真实 AI 编排服务（scripts/ai-orchestrator，联网搜索验证多个型号）后处理耗时
    # 是分钟级的，这个阈值必须明显大于真实处理时间，否则会把还在正常处理的任务误判为超时
    timeout-minutes: ${AI_TASK_TIMEOUT_MINUTES:20}
    # 超时扫描的执行间隔（毫秒）
    timeout-check-interval-ms: ${AI_TASK_TIMEOUT_CHECK_INTERVAL_MS:60000}

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.zhul.erp: debug
    org.springframework.security: info
