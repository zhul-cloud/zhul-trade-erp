server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: zhul-erp
  profiles:
    active: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:zhul_erp}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms


  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

jwt:
  secret: ${JWT_SECRET:zhul-erp-secret-key-must-be-at-least-256-bits-long}
  expiration: 7200
  remember-me-expiration: 604800

zhul:
  crypto:
    aes-key: ${AES_KEY:zhul-erp-config-aes-key}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  ai-task:
    # AI 编排服务地址（本次不实现该服务本身，本地联调可指向 scripts/ai-orchestrator-stub）
    orchestrator-base-url: ${AI_ORCHESTRATOR_BASE_URL:http://localhost:8899}
    # zhul-erp-backend 自身对外可达地址，用于拼出 webhook 回调地址
    callback-base-url: ${AI_TASK_CALLBACK_BASE_URL:http://localhost:8080}
    # webhook 回调鉴权共享密钥，AI 编排服务回调时须在 X-AI-Callback-Token 头携带同样的值
    callback-token: ${AI_TASK_CALLBACK_TOKEN:zhul-erp-ai-callback-secret}

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.zhul.erp: debug
    org.springframework.security: info
