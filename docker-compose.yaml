# 唯一部署入口：默认仅 MySQL/Redis；--profile app 启动全部；显式服务名独立部署。
# 默认所有业务数据使用 tmpfs，停止/重启即清空，各服务启动时会打印警告。
# 持久化请按服务注释切换到 ./storage/，详见 docs/06-部署运维/03-数据持久化与备份.md。
# 不要用 COMPOSE_PROFILES=app 改变默认启动范围。
services:
  mysql:
    image: mysql:8.0
    container_name: zhul-erp-mysql
    restart: unless-stopped
    environment:
      # 统一北京时间：NOW()、DEFAULT CURRENT_TIMESTAMP 按北京时间写入（与后端一致，见 .claude/rules/coding.md）
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zhul_erp}
      # 可选非 root 应用账号；为空时官方镜像不创建额外用户。
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
    # 数据目录是临时存储时先打印警告，再交给官方入口启动。
    entrypoint: ["/bin/sh", "-c", "grep -qs ' /var/lib/mysql tmpfs ' /proc/mounts && echo '[警告] /var/lib/mysql 是临时存储（tmpfs），容器停止或重建后数据库会清空；需要保留请按 docs/06-部署运维/03-数据持久化与备份.md 启用持久化' >&2; exec docker-entrypoint.sh \"$$@\"", "--"]
    # 会话默认时区固定为 +08:00（中国无夏令时；不依赖镜像里的时区表）
    command: ["mysqld", "--default-time-zone=+08:00"]
    ports:
      - "${MYSQL_BIND_ADDRESS:-127.0.0.1}:${MYSQL_HOST_PORT:-3306}:3306"
    # 覆盖官方镜像的 VOLUME，避免隐式创建匿名持久化卷。
    tmpfs:
      - /var/lib/mysql
    # 启用持久化：注释上面的 tmpfs 两行，取消以下两行注释。
    # volumes:
    #   - ./storage/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql --protocol=TCP -h127.0.0.1 -uroot --database=\"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  redis:
    image: redis:7
    container_name: zhul-erp-redis
    restart: unless-stopped
    # AOF 在默认 tmpfs 中仍是临时数据；启用下面的 bind mount 后才会跨重启保留。
    entrypoint: ["/bin/sh", "-c", "grep -qs ' /data tmpfs ' /proc/mounts && echo '[警告] Redis /data 是临时存储（tmpfs），容器停止或重建后缓存与 AOF 会清空；需要保留请按 docs/06-部署运维/03-数据持久化与备份.md 启用持久化' >&2; exec docker-entrypoint.sh \"$$@\"", "--"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    tmpfs:
      - /data
    # 启用持久化：注释上面的 tmpfs 两行，取消以下两行注释。
    # volumes:
    #   - ./storage/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    profiles: [app]
    build:
      context: ./zhul-erp-backend
    image: zhul-erp-backend:local
    container_name: zhul-erp-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # 统一北京时间：LocalDateTime.now()、日志与定时任务都按北京时间
      TZ: Asia/Shanghai
      DB_URL: ${DB_URL:-}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-zhul_erp}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-}
      AES_KEY: ${AES_KEY:-}
      AI_TASK_CALLBACK_TOKEN: ${AI_TASK_CALLBACK_TOKEN:-}
      AI_ORCHESTRATOR_BASE_URL: ${AI_ORCHESTRATOR_BASE_URL:-http://ai-orchestrator:8899}
      AI_TASK_CALLBACK_BASE_URL: ${AI_TASK_CALLBACK_BASE_URL:-http://backend:8080}
      SPRING_FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration}
      DB_CONNECT_RETRIES: ${DB_CONNECT_RETRIES:-12}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*}
      UPLOAD_DIR: /app/uploads
      UPLOAD_PRIVATE_DIR: /app/private-uploads
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_REGION: ${OSS_REGION:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_PRIVATE_BUCKET: ${OSS_PRIVATE_BUCKET:-}
      OSS_PUBLIC_BUCKET: ${OSS_PUBLIC_BUCKET:-}
      OSS_PUBLIC_DOMAIN: ${OSS_PUBLIC_DOMAIN:-}
      OSS_KEY_PREFIX: ${OSS_KEY_PREFIX:-}
      # 发信邮箱（SMTP），找回密码验证码等系统邮件；见 docs/06-部署运维/09-发信邮箱.md
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SSL: ${MAIL_SSL:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-烛龙ERP}
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_HOST_PORT:-8080}:8080"
    # 无 depends_on：独立部署后端不会自动启动本地数据库。
    tmpfs:
      - /app/uploads:uid=10001,gid=10001,mode=0750
    # 私有上传（询盘附件等）与 AI 编排服务共享，默认是 tmpfs 类型的卷。
    volumes:
      - private-uploads:/app/private-uploads
    # 启用持久化：注释上面的 tmpfs 两行，并把 volumes 改成以下两行。
    # Linux 上先创建目录并授予容器用户 10001:10001 写权限，详见部署文档。
    # volumes:
    #   - ./storage/uploads:/app/uploads
    #   - ./storage/private-uploads:/app/private-uploads
    # 云服务私有 CA：可在同一个 volumes 列表追加只读 truststore 挂载，
    # 并通过 JAVA_TOOL_OPTIONS 配置 javax.net.ssl.trustStore（详见部署文档）。

  frontend:
    profiles: [app]
    build:
      context: ./zhul-erp-frontend
    image: zhul-erp-frontend:local
    container_name: zhul-erp-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8000}:80"
    # 无 depends_on：前端可单独部署，后端地址在容器启动时写入 Nginx 配置。

  ai-orchestrator:
    profiles: [app]
    build:
      context: ./scripts
      dockerfile: ai-orchestrator/Dockerfile
    image: zhul-erp-ai-orchestrator:local
    container_name: zhul-erp-ai-orchestrator
    restart: unless-stopped
    environment:
      AI_ORCHESTRATOR_MODE: ${AI_ORCHESTRATOR_MODE:-api}
      AI_ORCHESTRATOR_PROVIDER: ${AI_ORCHESTRATOR_PROVIDER:-}
      AI_ORCHESTRATOR_API_KEY: ${AI_ORCHESTRATOR_API_KEY:-}
      AI_ORCHESTRATOR_PARSE_MODEL: ${AI_ORCHESTRATOR_PARSE_MODEL:-}
      AI_ORCHESTRATOR_TRANSLATE_MODEL: ${AI_ORCHESTRATOR_TRANSLATE_MODEL:-}
      AI_ORCHESTRATOR_PARSE_EFFORT: ${AI_ORCHESTRATOR_PARSE_EFFORT:-}
      AI_ORCHESTRATOR_TRANSLATE_EFFORT: ${AI_ORCHESTRATOR_TRANSLATE_EFFORT:-}
      AI_ORCHESTRATOR_MAX_WEB_SEARCHES: ${AI_ORCHESTRATOR_MAX_WEB_SEARCHES:-20}
      AI_ORCHESTRATOR_TIMEOUT_SECONDS: ${AI_ORCHESTRATOR_TIMEOUT_SECONDS:-900}
      AI_TASK_CALLBACK_TOKEN: ${AI_TASK_CALLBACK_TOKEN:-}
    # 不映射宿主机端口：只供同一 Compose 网络里的后端调用。
    # 只读挂载后端的私有上传目录，用于读取询盘附件；路径必须与后端一致。
    volumes:
      - private-uploads:/app/private-uploads:ro
    # 启用持久化时与后端一起改成：
    # volumes:
    #   - ./storage/private-uploads:/app/private-uploads:ro

volumes:
  # 默认不持久化：tmpfs 类型，后端与 AI 编排服务共享；全部容器停止后内容清空。
  private-uploads:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=10001,gid=10001,mode=0750
