# PR 与 develop 的自动测试（audit DOC-005）：
# 后端 mvn test（连本工作流自己起的 MySQL、Redis，库由 Flyway 自动建）、
# 前端 lint（biome + tsc）、antd lint、Jest、构建，AI 编排服务单元测试。
# 要求见 docs/06-部署运维/11-分支与版本规范.md「日常开发」第 4 步。
name: CI

on:
  pull_request:
    branches: [develop, main, 'release/**', 'hotfix/**']
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # 与生产容器一致：北京时间（.claude/rules/coding.md）
      TZ: Asia/Shanghai
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      # 服务容器不能传启动参数，MySQL 需要固定会话时区 +08:00（与 docker-compose.yaml 一致），所以手动起
      - name: 启动 MySQL 8.0
        run: |
          docker run -d --name ci-mysql -p 3306:3306 -e TZ=Asia/Shanghai -e MYSQL_ROOT_PASSWORD=root \
            mysql:8.0 --default-time-zone=+08:00
          for i in $(seq 1 60); do
            if docker exec ci-mysql mysql -uroot -proot --protocol=TCP -h127.0.0.1 -e 'SELECT 1' >/dev/null 2>&1; then
              echo "MySQL 已就绪"; exit 0
            fi
            sleep 2
          done
          docker logs ci-mysql; echo "MySQL 启动超时"; exit 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn test
        working-directory: zhul-erp-backend
        run: mvn -B -ntp test
      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: zhul-erp-backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: '0'
      CI: 'true'
    defaults:
      run:
        working-directory: zhul-erp-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: zhul-erp-frontend/package-lock.json
      - run: npm ci
      - name: lint（biome + tsc）
        run: npm run lint
      - name: antd lint
        run: npx antd lint ./src
      - name: Jest
        run: npx jest --ci
      - name: 构建
        run: npm run build

  ai-orchestrator:
    name: AI 编排服务测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scripts/ai-orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ai-orchestrator/requirements.txt
      - run: pip install -r requirements.txt
      - name: unittest
        run: python -m unittest -v
