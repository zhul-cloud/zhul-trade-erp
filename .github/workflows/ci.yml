# PR 与 develop 的自动测试（audit DOC-005；提速与 pipefail 见 audit DOC-008）：
# 后端 mvn test（连本工作流自己起的 MySQL、Redis，库由 Flyway 自动建）、
# 前端 lint（biome + tsc）、antd lint、Jest、构建，AI 编排服务单元测试。
# 要求见 docs/06-部署运维/11-分支与版本规范.md「日常开发」第 4 步。
name: CI

on:
  pull_request:
    branches: [develop, main, 'release/**', 'hotfix/**']
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 显式指定 bash：GitHub 只有在写明 shell: bash 时才加 -o pipefail。
# 原来默认的 bash -e 不带 pipefail，`mvn test | tee` 失败也会被 tee 的退出码盖住，CI 照样通过（audit DOC-008）。
defaults:
  run:
    shell: bash

jobs:
  # 只改文档（audit/、docs/、openspec/、.claude/、根目录 *.md）时跳过测试；
  # 被跳过的必选检查在 GitHub 上算通过，不会卡住合并（audit DOC-008）
  changes:
    name: 判断改动范围
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE_SHA...HEAD"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]]; then
            range="$BEFORE..HEAD"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "手动触发或首次推送，全部运行"; exit 0
          fi
          git diff --name-only "$range" > changed.txt
          code=$(grep -vE '^(audit/|docs/|openspec/|\.claude/|[^/]+\.md$)' changed.txt | grep -c . || true)
          echo "改动文件：$(grep -c . changed.txt || true) 个，其中需要测试的 $code 个"
          if [ "$code" -gt 0 ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi

  # 后端测试分两组并行，各自起一套 MySQL、Redis（audit DOC-008）。
  # 第 1 组固定跑下面列出的模块，第 2 组跑其余所有测试，以后新增的包自动落在第 2 组，不会漏跑。
  backend-shard:
    name: 后端测试（${{ matrix.shard }}/2）
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      # 与生产容器一致：北京时间（.claude/rules/coding.md）
      TZ: Asia/Shanghai
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      SHARD1_MODULES: finance sales logistics purchase warehouse
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      # 服务容器不能传启动参数，MySQL 需要固定会话时区 +08:00（与 docker-compose.yaml 一致），所以手动起；
      # 先在后台启动，装 Java、ffmpeg 的同时等它就绪
      - name: 启动 MySQL 8.0
        run: |
          docker run -d --name ci-mysql -p 3306:3306 -e TZ=Asia/Shanghai -e MYSQL_ROOT_PASSWORD=root mysql:8.0 --default-time-zone=+08:00
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # 视频转码测试（framework.storage，在第 2 组）要 ffmpeg，没有时这些用例会被跳过
      - name: 安装 ffmpeg
        if: matrix.shard == 2
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
      - name: 等待 MySQL 就绪
        run: |
          for i in $(seq 1 60); do
            if docker exec ci-mysql mysql -uroot -proot --protocol=TCP -h127.0.0.1 -e 'SELECT 1' >/dev/null 2>&1; then
              echo "MySQL 已就绪"; exit 0
            fi
            sleep 2
          done
          docker logs ci-mysql; echo "MySQL 启动超时"; exit 1
      - name: 生成本组排除清单
        working-directory: zhul-erp-backend
        run: |
          : > ../shard-excludes.txt
          for d in src/test/java/com/zhul/erp/*/ src/test/java/com/zhul/erp/modules/*/; do
            p=${d#src/test/java/}; p=${p%/}
            [ "$p" = com/zhul/erp/modules ] && continue
            in1=false
            for m in $SHARD1_MODULES; do [ "$p" = "com/zhul/erp/modules/$m" ] && in1=true; done
            # 第 1 组排除不属于它的；第 2 组排除第 1 组的
            if { [ "${{ matrix.shard }}" = 1 ] && [ $in1 = false ]; } || { [ "${{ matrix.shard }}" = 2 ] && [ $in1 = true ]; }; then
              echo "$p/**" >> ../shard-excludes.txt
            fi
          done
          echo "本组排除："; cat ../shard-excludes.txt
      - name: mvn test
        working-directory: zhul-erp-backend
        run: mvn -B -ntp test -Dsurefire.excludesFile="$GITHUB_WORKSPACE/shard-excludes.txt" 2>&1 | tee ../mvn-test.log
      # 兜底：任务自己捕获异常只写日志时测试照样通过，日志里出现这些就判失败（audit SEC-011）
      - name: 检查日志里的租户与 SQL 错误
        run: |
          pattern='缺少租户上下文|BadSqlGrammarException|SQLSyntaxErrorException|JSQLParserException'
          if grep -qE "$pattern" mvn-test.log; then
            grep -nE "$pattern" mvn-test.log | head -20 || true
            echo "::error::测试日志里出现缺少租户上下文或 SQL 语法错误，见上方行号"
            exit 1
          fi
      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.shard }}
          path: |
            zhul-erp-backend/target/surefire-reports/
            mvn-test.log
          retention-days: 7

  # 分支规则要求的必选检查名就是「后端测试」：汇总两组结果，两组都通过（或只改文档时都被跳过）才算通过
  backend:
    name: 后端测试
    needs: [changes, backend-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          SHARDS: ${{ needs.backend-shard.result }}
        run: |
          echo "判断改动范围：$CHANGES；后端两组：$SHARDS"
          if [ "$CHANGES" != success ]; then echo "::error::判断改动范围失败"; exit 1; fi
          if [ "$CODE" = false ] && [ "$SHARDS" = skipped ]; then echo "只改了文档，跳过后端测试"; exit 0; fi
          if [ "$SHARDS" != success ]; then echo "::error::后端测试未全部通过"; exit 1; fi

  frontend:
    name: 前端检查
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: '0'
      CI: 'true'
    defaults:
      run:
        working-directory: zhul-erp-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: zhul-erp-frontend/package-lock.json
      - run: npm ci
      - name: lint（biome + tsc）
        run: npm run lint
      - name: antd lint
        run: npx antd lint ./src
      - name: Jest
        run: npx jest --ci
      - name: 构建
        run: npm run build

  ai-orchestrator:
    name: AI 编排服务测试
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scripts/ai-orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ai-orchestrator/requirements.txt
      - run: pip install -r requirements.txt
      - name: unittest
        run: python -m unittest -v
